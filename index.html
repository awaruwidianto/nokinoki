<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  
  <!-- Forces Chrome to look in the nokinoki folder, fixing the 404 -->
  <base href="/nokinoki/">

  <!-- Prevents zooming on iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- Connects your app to the manifest.json file -->
  <link rel="manifest" href="manifest.json" />
  
  <title>NOKI NOKI</title>
  
  <!-- App Icons for Tabs and Bookmarks -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  
  <!-- Reference Fonts Link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       AWARU UNIVERSE COSMIC VARIABLES & KEYFRAMES (Sleek Aesthetic)
       ========================================================== */
    :root{
      --body:#ffe4e8;
      --body2:#ffc2d1;
      --body3:#ff9aab;
      --screen:#ffffff;
      --screen2:#fff0f3;
      --screenBorder:#ff9aab;
      --ink:#111111;
      --inkSoft:#555555;
      --button:#ffffff;
      --button2:#ffe4e8;
      --buttonBorder:#ff9aab;
      --buttonShadow:#ff9aab;
      --accent:#ff9aab;
      --wall1:#ffe4e8;
      --wall2:#ffc2d1;
      --panel:rgba(255,255,255,.9);
      --panelTop:rgba(255,255,255,.95);
      --panelBot:rgba(255,255,255,.6);
      --avatarBg:rgba(255,255,255,.8);
      --danger:#ff9aab;
    }

    body.theme-allpink {
      --body:#ffe4e8; --body2:#ffc2d1; --body3:#ff9aab;
      --screen:#ffffff; --screen2:#fff0f3; --screenBorder:#ff9aab;
      --ink:#111111; --inkSoft:#555555;
      --button:#ffffff; --button2:#ffe4e8;
      --buttonBorder:#ff9aab; --buttonShadow:#ff9aab; --accent:#ff9aab;
      --wall1:#ffe4e8; --wall2:#ffc2d1;
      --panel:rgba(255,255,255,.9);
      --panelTop:rgba(255,255,255,.95);
      --panelBot:rgba(255,255,255,.6);
      --avatarBg:rgba(255,255,255,.8);
    }

    body.theme-blackpink {
      --body:#222222; --body2:#111111; --body3:#000000;
      --screen:#111111; --screen2:#222222; --screenBorder:#ff9aab;
      --ink:#ffffff; --inkSoft:#cccccc;
      --button:#222222; --button2:#333333;
      --buttonBorder:#ff9aab; --buttonShadow:#000000; --accent:#ff9aab;
      --wall1:#111111; --wall2:#333333;
      --panel:rgba(34,34,34,.9);
      --panelTop:rgba(51,51,51,.95);
      --panelBot:rgba(17,17,17,.6);
      --avatarBg:rgba(51,51,51,.8);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    
    /* Awaru Interactive Cosmos Background */
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
      font-family: "Nunito", "Noto Sans KR", system-ui, sans-serif; 
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 154, 171, .08), transparent 28%),
        radial-gradient(circle at 82% 26%, rgba(0, 0, 0, .04), transparent 24%),
        radial-gradient(circle at 45% 88%, rgba(255, 154, 171, .05), transparent 30%),
        linear-gradient(130deg, var(--wall2), var(--wall1), var(--body2), #ffffff);
      background-size: 200% 200%;
      animation: galaxyShift 22s ease-in-out infinite;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle, rgba(0,0,0,.15) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(0,0,0,.1) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(0,0,0,.05) 0 1.2px, transparent 2px);
      background-size: 44px 44px, 72px 72px, 118px 118px;
      background-position: 0 0, 14px 22px, 41px 7px;
      animation: starDrift 34s linear infinite;
      opacity: .92;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 12% 72%, rgba(0, 0, 0, .03), transparent 13%),
        radial-gradient(circle at 74% 14%, rgba(0, 0, 0, .02), transparent 16%),
        radial-gradient(circle at 88% 82%, rgba(0, 0, 0, .01), transparent 19%);
      filter: blur(2px);
      animation: nebulaPulse 12s ease-in-out infinite alternate;
    }

    /* Cosmic Background Animations */
    @keyframes galaxyShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes starDrift {
      from { background-position: 0 0, 14px 22px, 41px 7px; }
      to { background-position: 100px 150px, 114px 172px, 141px 157px; }
    }
    @keyframes nebulaPulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes planetFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes alienFloatCustom {
      0%, 100% { transform: translateY(0) translateX(0) scale(1); }
      50% { transform: translateY(-20px) translateX(10px) scale(1.05); }
    }
    @keyframes ufoCruise {
      0% { left: -70px; top: 60%; transform: scale(0.6) rotate(5deg); }
      50% { left: 50%; top: 40%; transform: scale(1) rotate(-5deg); }
      100% { left: calc(100% + 70px); top: 60%; transform: scale(0.6) rotate(5deg); }
    }
    @keyframes shooting {
      0% { transform: translate(0, 0) rotate(-25deg); opacity: 0; }
      8% { opacity: 1; }
      15% { transform: translate(-120px, 56px) rotate(-25deg); opacity: 0; }
      100% { transform: translate(-120px, 56px) rotate(-25deg); opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    /* Cosmic Backdrop Ornaments */
    .cosmic-decoration { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .planet, .shooting-star, .particle, .star-clicker, .cozy-alien { position: absolute; will-change: transform; }
    .planet { border-radius: 50%; filter: drop-shadow(0 16px 28px rgba(0, 0, 0, .1)); animation: planetFloat 9s ease-in-out infinite, dynamicColorShift 12s linear infinite; }
    .planet::before { content: ""; position: absolute; inset: 46% -34%; height: 18%; border: 3px solid rgba(255,255,255,.8); border-radius: 50%; transform: rotate(-18deg); }
    .planet.one { width: 86px; height: 86px; left: 7%; top: 10%; background: radial-gradient(circle at 35% 28%, #fff, #ff9aab 48%, #111); }
    .planet.two { width: 60px; height: 60px; right: 9%; top: 18%; background: radial-gradient(circle at 30% 24%, #fff, #e2e2e2 52%, #555); animation-delay: -2.5s; }
    .planet.three { width: 104px; height: 104px; right: 4%; bottom: 10%; background: radial-gradient(circle at 32% 28%, #fff, #f4f4f4 34%, #ff9aab 76%); animation-delay: -5s; }
    .shooting-star { width: 130px; height: 2px; border-radius: 99px; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.2)); transform: rotate(-25deg); opacity: 0; animation: shooting 8s ease-in-out infinite; }
    .shooting-star.s1 { top: 12%; left: 58%; }
    .shooting-star.s2 { top: 36%; left: 18%; animation-delay: 3.6s; }
    .particle { width: 7px; height: 7px; border-radius: 2px; background: rgba(0,0,0,.2); animation: particleFloat 13s ease-in-out infinite; }
    .p1 { left: 13%; bottom: 14%; } .p2 { left: 83%; bottom: 39%; animation-delay: -4s; } .p3 { left: 46%; top: 9%; animation-delay: -7s; }
    .cozy-alien {
      width: 32px; height: 32px; left: 15%; top: 45%; font-size: 32px; opacity: 0.85;
      animation: alienFloatCustom 14s ease-in-out infinite alternate; pointer-events: none; z-index: 1;
    }
    .star-clicker {
      width: 18px; height: 18px;
      background: #ff9aab;
      clip-path: polygon(50% 0%, 61% 34%, 98% 35%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 2% 35%, 39% 34%);
      filter: drop-shadow(0 0 10px rgba(255,154,171,.4));
      pointer-events: auto;
      cursor: pointer;
      animation: twinkle 1.9s ease-in-out infinite;
    }
    .star-clicker:nth-child(1) { left: 9%; top: 39%; } .star-clicker:nth-child(2) { left: 22%; top: 17%; animation-delay: -.4s; } .star-clicker:nth-child(3) { left: 76%; top: 44%; animation-delay: -.8s; } .star-clicker:nth-child(4) { left: 88%; top: 66%; animation-delay: -1.2s; } .star-clicker:nth-child(5) { left: 39%; bottom: 9%; animation-delay: -1.5s; }

    /* ==========================================================
       AWARU STYLED NOKI NOKI SHELL (Sleek Retro Style)
       ========================================================== */
    :root{
      --lcdLine:rgba(17,17,17,.15);
      --lcdDark:#111111;
      --phoneShadow:rgba(0,0,0,.15);
    }

    .phone{
      width:min(366px, calc(100vw - 20px));
      height:min(640px, calc(100vh - 24px));
      height:min(640px, calc(100dvh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
      max-height:640px;
      min-height:500px;
      position:relative;
      z-index: 10;
      border-radius:34px 34px 48px 48px;
      border: 5px solid var(--body3);
      padding:15px 14px 16px;
      gap:8px;
      display:flex;
      flex-direction:column;
      user-select:none;
      background:
        radial-gradient(circle at 50% 3%, rgba(255,255,255,.9) 0 8%, transparent 9%),
        linear-gradient(150deg, var(--body), var(--body2) 62%, var(--body3));
      box-shadow:
        inset 0 0 0 4px rgba(255,255,255,.6),
        inset 0 -18px 26px rgba(0,0,0,.1),
        10px 12px 0 var(--phoneShadow);
    }

    .hardwareHomeBtn{
      flex:0 0 clamp(58px, 10dvh, 76px);
      width:100%;
      border:4px solid var(--body3);
      border-radius:16px 16px 31px 31px;
      background:
        radial-gradient(circle at 50% 7%, rgba(255,255,255,.9) 0 15%, transparent 16%),
        linear-gradient(180deg, rgba(255,255,255,.8), rgba(0,0,0,.05)),
        linear-gradient(150deg, var(--body2), var(--body));
      box-shadow:
        inset 3px 3px 0 rgba(255,255,255,.9),
        inset -4px -4px 0 rgba(0,0,0,.1),
        0 2px 0 rgba(255,255,255,.8);
      display:grid;
      place-items:center;
      padding:8px;
      cursor:pointer;
      color:var(--ink);
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      touch-action:manipulation;
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      text-transform:uppercase;
    }

    .hardwareHomeBtnInner{
      min-width:132px;
      height:42px;
      border:3px solid var(--buttonBorder);
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.5)),
        var(--button);
      box-shadow:
        inset 2px 2px 0 rgba(255,255,255,.9),
        4px 4px 0 rgba(0,0,0,.1);
    }

    .hardwareHomeBtnIcon{
      width:25px;
      height:25px;
      border:2px solid var(--buttonBorder);
      border-radius:50%;
      display:grid;
      place-items:center;
      line-height:1;
      font-size:14px;
      background:rgba(255,255,255,.8);
      box-shadow:inset 1px 1px 0 rgba(255,255,255,.9);
    }

    .hardwareHomeBtnText{
      font-size:13px;
      font-weight:900;
      letter-spacing:3px;
      padding-top:1px;
    }

    .hardwareHomeBtn:active .hardwareHomeBtnInner{
      transform:translate(4px,4px);
      box-shadow:none;
    }

    .brand{
      text-align:center;
      letter-spacing:5px;
      font-weight:bold;
      font-size:16px;
      color:var(--ink);
      opacity:.84;
      text-transform: uppercase;
      text-shadow:2px 2px 0 rgba(255,255,255,.82); 
    }

    .speaker{
      width:86px;
      height:12px;
      border-radius:999px;
      border:3px solid var(--body3);
      margin:0 auto;
      background:
        repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 4px, transparent 4px 8px),
        rgba(0,0,0,.13);
      box-shadow:
        inset 2px 2px 0 rgba(0,0,0,.13),
        1px 1px 0 rgba(255,255,255,.45);
    }

    .screen{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      border:4px solid var(--screenBorder);
      border-radius:13px 13px 8px 8px; 
      background:
        repeating-linear-gradient(0deg, rgba(17,17,17,.03) 0 1px, transparent 1px 4px),
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.8), transparent 47%),
        linear-gradient(180deg,var(--screen),var(--screen2));
      box-shadow:
        inset 5px 5px 0 rgba(0,0,0,.1),
        inset -2px -2px 0 rgba(255,255,255,.6),
        0 0 0 2px rgba(255,255,255,.4);
      position:relative;
    }

    .screen::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 36%, transparent 0 58%, rgba(0,0,0,.04) 100%),
        linear-gradient(90deg, rgba(255,255,255,.2), transparent 18%, transparent 82%, rgba(0,0,0,.05));
      mix-blend-mode:multiply;
    }

    .statusbar{
      height:30px;
      padding:4px 8px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      border-bottom:3px solid var(--screenBorder); 
      background:rgba(0,0,0,.05);
      font-size:10px;
      font-weight:bold;
      white-space:nowrap;
    }

    .statusbar span:nth-child(2){
      max-width:120px;
      overflow:hidden;
      text-overflow:ellipsis;
      text-align:center;
    }

    .view{
      flex:1;
      min-height:0;
      display:none;
      flex-direction:column;
      padding:9px;
      overflow-y:auto; 
      overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
    }
    .view.active{display:flex}

    h1,h2,h3,p{margin:0}
    .title{
      font-size:16px;
      font-weight:bold;
      letter-spacing:1.6px;
      text-align:center;
      margin-bottom:8px;
      text-transform: uppercase;
      text-shadow:1px 1px 0 rgba(255,255,255,.6);
    }
    .subtitle{
      text-align:center;
      font-size:11px;
      line-height:1.45;
      opacity:.82;
      margin-bottom:10px;
      text-transform: uppercase;
      letter-spacing:.06em;
    }
    .lcdPanel{
      border:3px solid var(--buttonBorder);
      background:var(--panel);
      box-shadow:4px 4px 0 rgba(0,0,0,.1); 
      padding:8px;
      border-radius:5px; 
      margin-bottom:10px;
    }

    input, textarea{
      width:100%;
      border:3px solid var(--buttonBorder);
      background:var(--panel);
      color:var(--ink);
      font-family: inherit;
      font-weight:bold;
      padding:9px;
      border-radius:5px; 
      box-shadow:inset 3px 3px 0 rgba(0,0,0,.05);
      outline:none;
      user-select:text;
      font-size: 16px !important; 
    }
    textarea{resize:none;min-height:60px}
    input::placeholder, textarea::placeholder{color:var(--inkSoft)}
    label{
      display:block;
      font-size:11px;
      font-weight:bold;
      margin:7px 0 4px;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .row{display:flex;gap:8px;align-items:center}
    .row > *{flex:1}
    .tiny{font-size:11px;line-height:1.45;opacity:.82; text-transform: uppercase; letter-spacing:.06em;}
    .center{text-align:center}
    .hidden{display:none!important}

    .unreadBadge {
      background: #ff9aab;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      border: 2px solid var(--buttonBorder);
      margin-left: 6px;
      box-shadow: 2px 2px 0 rgba(0,0,0,.2);
    }

    .screenBtn, .menuItem, .themeChoice, .avatarChoice, .friendCard{
      width:100%;
      border:3px solid var(--buttonBorder);
      background:var(--panel);
      color:var(--ink);
      padding:8px;
      border-radius:7px; 
      text-align:left;
      font-family: inherit;
      font-weight:bold;
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.8),
        4px 4px 0 rgba(0,0,0,.1);
      cursor:pointer;
      user-select:none;
      text-transform: uppercase;
    }
    .screenBtn{
      text-align:center;
      background:var(--panelTop);
      margin-bottom: 6px;
    }
    .screenBtn.primary{
      background:var(--ink);
      color:var(--screen);
      border-color:var(--ink);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.2),
        4px 4px 0 rgba(0,0,0,.2);
    }
    .screenBtn.danger{
      color:var(--ink);
      background:#d1d1d1;
      border-color:var(--ink);
    }
    .screenBtn:active, .menuItem:active, .themeChoice:active, .avatarChoice:active, .friendCard:active{
      transform:translate(4px,4px);
      box-shadow:none;
    }

    .menuList{
      display:grid;
      gap:7px;
    }
    .menuItem{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      font-size:13px;
      min-height:43px;
      padding:8px 9px;
      background:linear-gradient(180deg, var(--panelTop), var(--panelBot));
    }
    .menuIcon{font-size:16px;width:30px;text-align:center;}
    .menuText{flex:1}
    .menuArrow{font-weight:bold; font-size:19px; line-height: 1;}

    .homeClock{
      font-size:clamp(30px, 11vw, 42px);
      font-weight:bold;
      text-align:center;
      letter-spacing:3px;
      margin-top:3px;
      text-shadow:
        2px 2px 0 rgba(255,255,255,.8),
        4px 4px 0 rgba(0,0,0,.1);
    }
    .homeHello{
      text-align:center;
      font-weight:bold;
      margin-bottom:10px;
      text-transform: uppercase;
      font-size: 12px;
      opacity:.92;
    }

    .avatarGrid,.themeGrid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
      margin:6px 0;
    }
    .avatarChoice{
      font-size:22px;
      text-align:center;
      padding:6px 2px;
      min-height:38px;
      background:var(--avatarBg);
    }
    .avatarChoice.selected,.themeChoice.selected{
      border-color: var(--accent);
      background:var(--panelTop);
      transform:translate(2px,2px);
      box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
    }

    .themeGrid{grid-template-columns:repeat(2,1fr)}
    .themeChoice{
      min-height:48px;
      display:flex;
      gap:6px;
      align-items:center;
      font-size:11px;
      background:var(--avatarBg);
    }
    .swatch{
      width:24px;
      height:24px;
      border:3px solid var(--buttonBorder);
      flex:none;
    }
    .swatch.allpink{background:#ff9aab}
    .swatch.blackpink{background:#111111; border-color:#ff9aab}

    .profileCard{
      text-align:center;
    }
    .bigAvatar{
      font-size:42px;
      line-height:1;
      margin-bottom:4px;
    }
    .profileName{
      font-weight:bold;
      font-size:16px;
      text-transform:uppercase;
    }
    .codeBox{
      border:3px dashed var(--buttonBorder);
      padding:6px;
      font-weight:bold;
      text-align:center;
      letter-spacing:1px;
      background:var(--panel);
      margin:6px 0;
      user-select:text;
      border-radius:4px;
    }

    .friendCard{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:8px; 
      background:linear-gradient(180deg, var(--panelTop), var(--panelBot));
    }
    .friendAvatar{
      width:34px;
      height:34px;
      border:3px solid var(--buttonBorder);
      display:grid;
      place-items:center;
      font-size:20px;
      background:var(--avatarBg);
      flex:none;
      border-radius:4px;
    }
    .friendInfo{flex:1;min-width:0}
    .friendName{
      font-size:12px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      text-transform:uppercase;
      display:flex;
      align-items:center;
    }
    .friendSub{
      font-size:10px;
      opacity:.85;
      margin-top:2px;
      letter-spacing:.06em;
    }
    
    .removeBtn {
      background: #e2e2e2;
      color: #111;
      border: 3px solid #111;
      font-weight: bold;
      font-size: 13px;
      padding: 4px 8px;
      cursor: pointer;
      box-shadow: 3px 3px 0 rgba(0,0,0,.15);
      font-family: inherit;
    }
    .removeBtn:active {
      transform: translate(3px, 3px);
      box-shadow: none;
    }

    .chatView{padding:0}
    .chatHeader{
      padding:7px 9px;
      border-bottom:3px solid var(--screenBorder);
      background:rgba(0,0,0,.05);
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:bold;
    }

    /* GAME CSS */
    .gameZone {
      flex:1;

    /* ==========================================================
       AWARU RETRO OPENING SCREEN OVERLAY (COSMIC UFO INTRO)
       ========================================================== */
    .starfield {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      background: radial-gradient(circle at center, #222222 0%, #000000 100%);
    }

    .star {
      position: absolute;
      background-color: #ffffff;
      border-radius: 50%;
      animation: twinkle var(--duration) infinite ease-in-out alternate;
      opacity: var(--opacity);
    }

    .nebula {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 154, 171, 0.15) 0%, rgba(255, 176, 193, 0.05) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
      filter: blur(40px);
    }

    .ufo-wrapper {
      position: relative;
      z-index: 10;
      width: 300px;
      height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transform: translate(-100vw, -100vh) scale(0.1) rotate(-45deg);
      animation: ufoFlyIn 4s cubic-bezier(0.25, 1, 0.5, 1) forwards, 
                 ufoHover 4s ease-in-out infinite alternate 4s;
    }

    @keyframes ufoFlyIn {
      0% {
        transform: translate(-80vw, -80vh) scale(0.1) rotate(-35deg);
      }
      60% {
        transform: translate(5vw, 5vh) scale(1.1) rotate(10deg);
      }
      100% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
    }

    @keyframes ufoHover {
      0% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-15px) rotate(-2deg);
      }
      100% {
        transform: translateY(10px) rotate(2deg);
      }
    }

    .ufo-svg {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 20px rgba(255, 154, 171, 0.3));
    }

    .ufo-light {
      animation: lightPulse var(--speed) infinite alternate;
    }

    @keyframes lightPulse {
      0% { fill-opacity: 0.3; filter: drop-shadow(0 0 1px currentColor); }
      100% { fill-opacity: 1; filter: drop-shadow(0 0 8px currentColor); }
    }

    .tractor-beam {
      position: absolute;
      top: 115px; 
      width: 160px;
      height: 280px;
      background: linear-gradient(to bottom, rgba(255, 154, 171, 0.6) 0%, rgba(255, 154, 171, 0.1) 60%, rgba(255, 154, 171, 0) 100%);
      clip-path: polygon(45% 0%, 55% 0%, 100% 100%, 0% 100%);
      opacity: 0;
      transform: scaleY(0);
      transform-origin: top center;
      z-index: 9;
      animation: beamDeploy 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 4s,
                 beamPulse 2s ease-in-out infinite alternate 5.5s;
    }

    @keyframes beamDeploy {
      0% {
        opacity: 0;
        transform: scaleY(0);
      }
      100% {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    @keyframes beamPulse {
      0% {
        opacity: 0.7;
        filter: drop-shadow(0 0 5px rgba(255, 154, 171, 0.3));
      }
      100% {
        opacity: 1;
        filter: drop-shadow(0 0 20px rgba(255, 154, 171, 0.6));
      }
    }

    .glass-dome {
      fill: url(#dome-grad);
      stroke: #111;
      stroke-width: 1px;
    }

    .cute-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 38px;
      padding: 8px 20px;
      font-size: 14px;
      border-radius: 12px;
      border: 3px solid #111;
      background: linear-gradient(180deg, #fff, #f4f4f4);
      color: #111;
      font-weight: 1000;
      box-shadow: 0 4px 0 #111, 0 8px 16px rgba(0, 0, 0, .05);
      transition: transform .18s cubic-bezier(.18,.89,.32,1.28), box-shadow .18s, filter .2s;
      cursor: pointer;
    }
    .cute-button:hover { transform: translateY(-3px) scale(1.02); filter: brightness(0.98); }
    .cute-button:active { transform: translateY(2px) scale(.98); box-shadow: 0 2px 0 #111; }
    .pink-button { background: linear-gradient(180deg, #ffb3c1, #ff9aab); color: #fff; }

    @media (max-height:700px){
      .phone{
        height:calc(100dvh - 14px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));

    /* ==========================================================
       PIXEL DETAIL PASS — visual-only overrides inspired by the
       supplied reference. Existing HTML / IDs / JS stay unchanged.
       ========================================================== */
    :root{
      --px-outline:#6b3b50;
      --px-shadow:#d98eae;
      --px-deep:#4d2a3b;
      --px-paper:#fffafc;
      --px-panel:#fff6fa;
      --px-grid:rgba(255,255,255,.34);
      --px-highlight:#ffffff;
    }

    body.theme-allpink{
      --px-outline:#6b3b50;
      --px-shadow:#d98eae;
      --px-deep:#4d2a3b;
      --px-paper:#fffafc;
      --px-panel:#fff6fa;
      --px-grid:rgba(255,255,255,.34);
      --px-highlight:#ffffff;
    }

    body.theme-blackpink{
      --px-outline:#ff9aab;
      --px-shadow:#000000;
      --px-deep:#ffffff;
      --px-paper:#151515;
      --px-panel:#202020;
      --px-grid:rgba(255,154,171,.08);
      --px-highlight:#353535;
    }

    body{
      background:
        linear-gradient(90deg, var(--px-grid) 1px, transparent 1px),
        linear-gradient(var(--px-grid) 1px, transparent 1px),
        linear-gradient(180deg, var(--wall2), var(--wall1) 48%, var(--body2));
      background-size:22px 22px,22px 22px,100% 100%;
      animation:none;
      image-rendering:pixelated;
    }

    body::before{
      background-image:
        radial-gradient(circle at center, color-mix(in srgb, var(--accent) 36%, transparent) 0 2px, transparent 2.5px),
        radial-gradient(circle at center, rgba(255,255,255,.9) 0 1.5px, transparent 2px);
      background-size:92px 92px,67px 67px;
      background-position:11px 7px,32px 39px;
      animation:none;
      opacity:.42;
    }

    body::after{
      filter:none;
      animation:none;
      background:
        linear-gradient(180deg,rgba(255,255,255,.12),transparent 24%,transparent 78%,rgba(241,79,148,.05));
    }

    .cosmic-decoration{ image-rendering:pixelated; }
    .planet{
      border-radius:8px;
      border:3px solid var(--px-outline);
      box-shadow:4px 4px 0 var(--px-shadow);
      filter:none;
      animation-timing-function:steps(4,end), steps(4,end);
    }
    .planet::before{
      inset:45% -26%;
      height:14%;
      border:3px solid var(--px-outline);
      border-radius:2px;
      background:rgba(255,255,255,.32);
    }
    .particle{
      width:8px;
      height:8px;
      border-radius:0;
      background:var(--px-outline);
      box-shadow:8px 8px 0 color-mix(in srgb, var(--accent) 65%, transparent);
    }
    .star-clicker{
      width:16px;
      height:16px;
      background:var(--accent);
      clip-path:polygon(40% 0,60% 0,60% 40%,100% 40%,100% 60%,60% 60%,60% 100%,40% 100%,40% 60%,0 60%,0 40%,40% 40%);
      filter:drop-shadow(2px 2px 0 var(--px-outline));
      animation:twinkle 1.4s steps(2,end) infinite;
    }
    .cozy-alien{
      filter:drop-shadow(3px 3px 0 color-mix(in srgb, var(--px-outline) 48%, transparent));
      animation-timing-function:steps(5,end);
    }

    .phone{
      width:min(372px, calc(100vw - 20px));
      border:4px solid var(--px-outline);
      border-radius:18px 18px 24px 24px;
      padding:13px 12px 14px;
      gap:8px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(180deg,var(--body),var(--body2) 68%,var(--body3));
      background-size:12px 12px,12px 12px,100% 100%;
      box-shadow:
        inset 3px 3px 0 rgba(255,255,255,.5),
        inset -3px -3px 0 rgba(0,0,0,.08),
        8px 8px 0 var(--px-shadow),
        0 20px 48px rgba(104,48,75,.12);
    }

    .brand{
      font-family:"Press Start 2P", ui-monospace, monospace;
      font-size:11px;
      line-height:1.5;
      letter-spacing:2px;
      opacity:1;
      text-shadow:2px 2px 0 rgba(255,255,255,.62);
    }

    .speaker{
      width:88px;
      height:12px;
      border:3px solid var(--px-outline);
      border-radius:3px;
      background:
        repeating-linear-gradient(90deg,var(--px-outline) 0 4px,transparent 4px 8px),
        rgba(255,255,255,.26);
      box-shadow:2px 2px 0 color-mix(in srgb, var(--px-shadow) 75%, transparent);
    }

    .screen{
      border:4px solid var(--px-outline);
      border-radius:7px;
      background:
        repeating-linear-gradient(0deg, rgba(17,17,17,.035) 0 1px, transparent 1px 4px),
        linear-gradient(180deg,var(--screen),var(--screen2));
      box-shadow:
        inset 4px 4px 0 rgba(0,0,0,.08),
        inset -2px -2px 0 rgba(255,255,255,.55),
        3px 3px 0 color-mix(in srgb, var(--px-shadow) 74%, transparent);
    }

    .screen::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:30;
      opacity:.16;
      background:
        linear-gradient(90deg, transparent 0 49%, rgba(255,255,255,.38) 50%, transparent 51%) 0 0/8px 8px,
        linear-gradient(0deg, transparent 0 49%, rgba(17,17,17,.14) 50%, transparent 51%) 0 0/8px 8px;
      mix-blend-mode:multiply;
    }
    .screen::after{
      background:linear-gradient(90deg,rgba(255,255,255,.11),transparent 14%,transparent 86%,rgba(0,0,0,.05));
      mix-blend-mode:multiply;
    }

    .statusbar{

    .title{

    // --- SOUND SYSTEM & BACKGROUND KEEP-ALIVE AUDIO ---
    let soundEnabled = localStorage.getItem("nokiSound") !== "false";

    function buildWavDataUri(segments, sampleRate = 22050) {
      let totalSamples = 0;
      for (const seg of segments) {
        totalSamples += Math.floor(seg.duration * sampleRate);
      }
      const buffer = new ArrayBuffer(44 + totalSamples * 2);
      const view = new DataView(buffer);
      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + totalSamples * 2, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, totalSamples * 2, true);

      let offset = 44;
      for (const seg of segments) {
        const count = Math.floor(seg.duration * sampleRate);
        const freq = seg.freq || 0;
        const vol = seg.volume !== undefined ? seg.volume : 0.65;
        for (let i = 0; i < count; i++) {
          let sample = 0;
          if (freq > 0) {
            const t = i / sampleRate;
            const env = Math.exp(-3.5 * (i / count));
            sample = Math.sin(2 * Math.PI * freq * t) * vol * env;
          }
          const pcm = Math.max(-1, Math.min(1, sample));
          view.setInt16(offset, pcm * 32767, true);
          offset += 2;
        }
      }

      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return "data:audio/wav;base64," + btoa(binary);
    }

    // Retro dual-tone NOKI NOKI incoming message chime WAV (works even when tab is backgrounded)
    const chimeAudio = new Audio(
      buildWavDataUri([
        { freq: 880, duration: 0.11, volume: 0.85 },
        { freq: 0, duration: 0.02, volume: 0 },
        { freq: 1320, duration: 0.18, volume: 0.9 }
      ])
    );
    chimeAudio.preload = "auto";
    chimeAudio.playsInline = true;

    // Imperceptible looping WAV that keeps the browser tab / bookmarked app alive in the background
    const keepAliveAudio = new Audio(
      buildWavDataUri([{ freq: 1, duration: 1.0, volume: 0.0001 }], 8000)
    );
    keepAliveAudio.loop = true;
    keepAliveAudio.volume = 0.01;
    keepAliveAudio.preload = "auto";
    keepAliveAudio.playsInline = true;
    let keepAliveStarted = false;

    function startBackgroundKeepAlive() {
      try {
        if ("audioSession" in navigator && navigator.audioSession) {
          navigator.audioSession.type = "ambient";
        }
      } catch (e) {}

      if (!keepAliveStarted || keepAliveAudio.paused) {
        keepAliveAudio.play().then(() => {
          keepAliveStarted = true;
        }).catch(() => {});
      }

      if (audioCtx && !audioCtx._keepAliveOsc) {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          gain.gain.value = 0.00001;
          osc.frequency.value = 1;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          audioCtx._keepAliveOsc = osc;
        } catch (e) {}
      }
    }

    // Request persistent Web Lock so the browser does not freeze or discard the background tab
    if (navigator.locks && navigator.locks.request) {
      navigator.locks.request("noki_background_keep_alive", { mode: "shared" }, () => {
        return new Promise(() => {});
      }).catch(() => {});
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      if (!audioCtx._unlocked) {
        try {
          const buffer = audioCtx.createBuffer(1, 1, 22050);
          const source = audioCtx.createBufferSource();
          source.buffer = buffer;
          source.connect(audioCtx.destination);
          source.start(0);
          audioCtx._unlocked = true;
        } catch (e) {}
      }
      startBackgroundKeepAlive();
    }

    const unlockEvents = ['click', 'touchstart', 'keydown'];
    const unlockAudio = () => {
      initAudio();
      // Prime chimeAudio element on first gesture so background playback is permitted on iOS/Android
      if (!chimeAudio._primed) {
        chimeAudio.muted = true;
        chimeAudio.play().then(() => {
          chimeAudio.pause();
          chimeAudio.currentTime = 0;
          chimeAudio.muted = false;
          chimeAudio._primed = true;
        }).catch(() => {
          chimeAudio.muted = false;
        });
      }
    };
    unlockEvents.forEach(e => document.addEventListener(e, unlockAudio, { passive: true }));

    function playBeep(freq, type, duration, delaySec = 0) {
      if (!soundEnabled) return;
      initAudio();

      const scheduleTone = () => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type; 
          osc.frequency.value = freq;
          osc.connect(gain); 
          gain.connect(audioCtx.destination);
          
          const now = audioCtx.currentTime + delaySec;
          gain.gain.setValueAtTime(1, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          
          osc.start(now);
          osc.stop(now + duration);
        } catch (e) { }
      };

      if (audioCtx.state !== 'running') {
        audioCtx.resume().then(scheduleTone).catch(() => {});
      } else {
        scheduleTone();
      }
    }

    async function ensureUserCode(userProfile, fallbackUid) {
      if (!userProfile) return userProfile;
      const uid = userProfile.uid || fallbackUid;
      userProfile.uid = uid;

      let code = safeText(userProfile.code || userProfile.friendCode || "");

      if (!code) {
        try {
          const pubSnap = await get(ref(db, "publicCodes"));
          if (pubSnap.exists()) {
            const allCodes = pubSnap.val() || {};
            for (const [k, v] of Object.entries(allCodes)) {
              if (v && (v.uid === uid || (v.nickname && v.nickname.toLowerCase() === uid))) {
                code = v.code || k;
                break;
              }
            }
          }
        } catch (e) {}
      }

      if (!code) {
        try {
          const fSnap = await get(ref(db, `friends/${uid}`));
          if (fSnap.exists()) {
            const fList = Object.values(fSnap.val() || {});
            for (const f of fList) {
              if (f && f.uid) {
                const mirrorSnap = await get(ref(db, `friends/${f.uid}/${uid}`));
                if (mirrorSnap.exists() && mirrorSnap.val()?.code) {
                  code = mirrorSnap.val().code;
                  break;
                }
              }
            }
          }
        } catch (e) {}
      }

      if (!code) {
        code = await generateCode();
      }

      userProfile.code = code;

      try {
        await update(ref(db), {
          [`users/${uid}/uid`]: uid,
          [`users/${uid}/code`]: code,
          [`publicCodes/${code}`]: {
            uid: uid,
            nickname: userProfile.nickname || uid.toUpperCase(),
            avatar: userProfile.avatar || "💛",
            code: code
          }
        });
      } catch (e) {}

      return userProfile;

    // --- UI RENDERING ---
    function renderSetupChoices() {
      const avatarBox = $("setupAvatars");
      avatarBox.innerHTML = "";
      avatars.forEach(avatar => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "avatarChoice" + (avatar === selectedAvatar ? " selected" : "");
        button.textContent = avatar;
        button.addEventListener("click", () => {
          selectedAvatar = avatar;
          renderSetupChoices();
        });
        avatarBox.appendChild(button);
      });
    }

    function renderEditAvatars() {
      const box = $("editAvatars");
      if(!box) return;
      box.innerHTML = "";
      avatars.forEach(avatar => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "avatarChoice" + (avatar === editProfileAvatar ? " selected" : "");
        btn.textContent = avatar;
        btn.addEventListener("click", () => {
          editProfileAvatar = avatar;
          renderEditAvatars();
        });
        box.appendChild(btn);
      });
    }

    function renderThemeSelections() {
      const themeBox = $("themeChoices");
      if (!themeBox) return;
      themeBox.innerHTML = "";

      themes.forEach(theme => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "themeChoice" + (theme.id === selectedTheme ? " selected" : "");
        button.innerHTML = `<span class="swatch ${theme.swatch}"></span><span>${theme.label}</span>`;
        button.addEventListener("click", async () => {
          applyTheme(theme.id);
          if (profile && currentUser) {
            profile.theme = theme.id;
            localStorage.setItem("nokiProfile", JSON.stringify(profile));
            await update(ref(db, `users/${currentUser.uid}`), { theme: theme.id });
          }
          showToast(theme.label);
        });
        themeBox.appendChild(button);
      });
    }

    let notifEnabled = localStorage.getItem("nokiNotif") !== "false";

    function isNotifGranted() {
      return ("Notification" in window) && Notification.permission === "granted" && notifEnabled;
    }

    function syncUserToSW(unreadMap = null) {
      if (!("serviceWorker" in navigator)) return;
      const payload = {
        type: "SET_USER",
        uid: currentUser?.uid || null,
        lang: currentLang,
        notifEnabled: isNotifGranted(),
        unreadMap: unreadMap
      };
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage(payload);
      } else if (swReg && swReg.active) {
        swReg.active.postMessage(payload);
      }
    }

    async function triggerMessageNotification(friend) {
      if (!isNotifGranted()) return;
      const sender = friend.nickname || "Friend";
      const avatar = friend.avatar || "💬";
      let bodyText = friend.lastMessageText
        ? `${avatar} ${friend.lastMessageText}`
        : (currentLang === "ko" ? "새 메시지가 도착했습니다!" : (currentLang === "id" ? "Pesan baru masuk!" : "New message received!"));
      const title = `NOKI NOKI · ${sender}`;
      const options = {
        body: bodyText,
        icon: "icon.png",
        badge: "icon.png",
        tag: "noki-msg-" + (friend.uid || "chat"),
        renotify: true,
        silent: false,
        vibrate: [200, 100, 200],
        requireInteraction: true,
        data: { friendUid: friend.uid || null, url: "/nokinoki/" }
      };
      try {
        const reg = swReg || (await navigator.serviceWorker?.getRegistration());
        if (reg && reg.showNotification) {
          await reg.showNotification(title, options);
          return;
        }
      } catch (e) {}
      try {
        const n = new Notification(title, options);
        n.onclick = () => {
          window.focus();
          if (profile) openPrivateChat(friend);
          n.close();
        };
      } catch (e) {}
    }

    function updateSettingsLabels() {
      const soundLabels = { en: "SOUND: ", ko: "소리: ", id: "SUARA: " };
      $("toggleSoundBtn").textContent = soundLabels[currentLang] + (soundEnabled ? "ON" : "OFF");

      const notifLabels = { en: "ALERTS: ", ko: "알림: ", id: "NOTIF: " };
      const notifBtn = $("toggleNotifBtn");
      if (notifBtn) {
        const activeState = ("Notification" in window) && Notification.permission === "granted" && notifEnabled;
        notifBtn.textContent = notifLabels[currentLang] + (activeState ? "ON" : "OFF");
      }
      
      document.querySelectorAll(".lang-btn").forEach(btn => {
        if (btn.dataset.lang === currentLang) {
          btn.classList.add("active-lang");
        } else {
          btn.classList.remove("active-lang");
        }
      });
    }

    $("toggleSoundBtn").addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem("nokiSound", soundEnabled);
      updateSettingsLabels();
      if(soundEnabled) playBeep(800, 'sine', 0.1);
    });

    $("toggleNotifBtn").addEventListener("click", async () => {
      if (!("Notification" in window)) {
        return showToast(currentLang === "ko" ? "브라우저 알림 미지원" : "NOT SUPPORTED");
      }
      if (Notification.permission !== "granted") {
        const perm = await Notification.requestPermission();
        if (perm !== "granted") {
          notifEnabled = false;
          localStorage.setItem("nokiNotif", "false");
          updateSettingsLabels();
          return showToast(currentLang === "ko" ? "알림 권한이 거부됨" : "PERMISSION DENIED");
        }
        notifEnabled = true;
      } else {
        notifEnabled = !notifEnabled;
      }
      localStorage.setItem("nokiNotif", notifEnabled);
      updateSettingsLabels();
      syncUserToSW();
      if (notifEnabled) {
        playBeep(800, 'sine', 0.1);
        showToast(currentLang === "ko" ? "알림 켜짐!" : (currentLang === "id" ? "NOTIF AKTIF!" : "ALERTS ON!"));
      } else {
        showToast(currentLang === "ko" ? "알림 꺼짐" : (currentLang === "id" ? "NOTIF MATI" : "ALERTS OFF"));
      }
    });

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        soundClick();
        currentLang = e.currentTarget.dataset.lang;
        localStorage.setItem("nokiLang", currentLang);
        applyLang();
      });
    });

    function renderHome() {
      if (!profile) return;
      $("homeHello").textContent = `${profile.avatar} ${profile.nickname}`;
      if (profile.code) {
        $("myCodeBox").textContent = profile.code;
        $("profileCode").textContent = profile.code;
      }
    }

    function renderInbox() {
      const inbox = $("inboxFriends");
      inbox.innerHTML = "";

      const values = Object.values(friends || {});
      if (!values.length) {
        const empty = document.createElement("div");
        empty.className = "lcdPanel tiny center";
        let msg = "NO FRIENDS YET.";
        if (currentLang === 'ko') msg = "친구가 없습니다.";
        if (currentLang === 'id') msg = "BELUM ADA TEMAN.";
        empty.textContent = msg;
        inbox.appendChild(empty);
        return;
      }
      values.sort((a,b) => (b.addedAt || 0) - (a.addedAt || 0))
            .forEach(friend => {
               if (friend && friend.uid) { 
                   inbox.appendChild(friendButton(friend, true));
               }
            });
    }

    function renderFriends() {
      if (profile) {
        $("myCodeBox").textContent = profile.code || "...";
        if (!profile.code) ensureUserCode(profile, currentUser?.uid);
      }
      const list = $("friendsList");
      list.innerHTML = "";

      const values = Object.values(friends || {});
      if (!values.length) {
        const empty = document.createElement("div");
        empty.className = "lcdPanel tiny center";
        let msg = "NO FRIENDS YET.";
        if (currentLang === 'ko') msg = "친구가 없습니다.";
        if (currentLang === 'id') msg = "BELUM ADA TEMAN.";
        empty.textContent = msg;
        list.appendChild(empty);
        return;
      }
      values.sort((a,b) => (a.nickname || "").localeCompare(b.nickname || ""))
            .forEach(friend => {
               if (friend && friend.uid) { 
                   list.appendChild(friendButton(friend, false));
               }
            });
    }

    function friendButton(friend, isInbox) {
      const card = document.createElement("div");
      card.className = "friendCard";
      card.role = "button";
      card.tabIndex = 0;
      
      let badgeHTML = '';
      if (isInbox && friend.unread) {
        badgeHTML = `<span class="unreadBadge">${friend.unread}</span>`;
      }

      let rightSide = `<div style="font-size:24px; font-weight:bold;">›</div>`;
      if (!isInbox) {
        rightSide = `<button class="removeBtn" data-uid="${friend.uid}">✕</button>`;
      }

      card.innerHTML = `
        <div class="friendAvatar">${friend.avatar || "💬"}</div>
        <div class="friendInfo">
          <div class="friendName">${escapeHTML(friend.nickname || "Friend")} ${badgeHTML}</div>
          <div class="friendSub">${escapeHTML(friend.code || "NOKI")}</div>
        </div>
        ${rightSide}
      `;
      
      card.addEventListener("click", (e) => {
        if (!isInbox && e.target.classList.contains("removeBtn")) {
          e.stopPropagation();
          removeFriend(friend);
        } else {
          openPrivateChat(friend);
        }
      });
      return card;
    }

    async function removeFriend(friend) {
      if (!profile || !friend.uid) return;
      if (!confirm(t("confirmRemove"))) return;
      
      try {
        const chatId = chatIdFor(profile.uid, friend.uid);
        await remove(ref(db, `friends/${profile.uid}/${friend.uid}`));
        await remove(ref(db, `friends/${friend.uid}/${profile.uid}`));
        await remove(ref(db, `conversations/${chatId}`)); 
        showToast(currentLang === 'ko' ? "삭제됨" : "DELETED");
      } catch(e) {
        showToast("Error: " + e.message);
      }
    }

    let prevUnreadMap = {};
    let initialFriendsLoaded = false;
    let bgWorker = null;

    function processFriendsSnapshot(incomingFriends) {
      friends = incomingFriends || {};

      let totalUnread = 0;
      const currentUnreadMap = {};
      Object.values(friends).forEach(f => { 
        if (f && f.uid) {
          const count = f.unread || 0;
          totalUnread += count;
          currentUnreadMap[f.uid] = count;

          if (initialFriendsLoaded) {
            const prevCount = prevUnreadMap[f.uid] || 0;
            if (count > prevCount) {
              const inThisChat = (activeView === "chatView" && currentChat?.targetUid === f.uid && !document.hidden && document.hasFocus());
              if (!inThisChat) {
                soundIncoming();
                triggerMessageNotification(f);
              }
            }
          }
        }
      });
      prevUnreadMap = currentUnreadMap;
      initialFriendsLoaded = true;
      syncUserToSW(currentUnreadMap);

      const badgeSpan = $("menuInboxBadge");
      if(badgeSpan) badgeSpan.textContent = totalUnread > 0 ? ` (${totalUnread})` : "";
      
      if (navigator.setAppBadge) {
        if (totalUnread > 0) {
          navigator.setAppBadge(totalUnread).catch(e => console.error("Badge error:", e));
        } else {
          navigator.clearAppBadge().catch(e => console.error("Badge clear error:", e));
        }
      }

      if (activeView === "inboxView") renderInbox();
      if (activeView === "friendsView") renderFriends();
    }

    function startBackgroundWorker() {
      if (bgWorker) return;
      try {
        const workerCode = `
          let timer = null;
          self.onmessage = (e) => {
            if (e.data === 'START') {
              if (timer) clearInterval(timer);
              timer = setInterval(() => self.postMessage('TICK'), 4000);
            }
          };
        `;
        const blob = new Blob([workerCode], { type: "application/javascript" });
        bgWorker = new Worker(URL.createObjectURL(blob));
        bgWorker.onmessage = async () => {
          if (!currentUser?.uid) return;
          startBackgroundKeepAlive();
          syncUserToSW(prevUnreadMap);
          if (document.hidden || !document.hasFocus()) {
            try {
              const res = await fetch(`${firebaseConfig.databaseURL}friends/${encodeURIComponent(currentUser.uid)}.json`, { cache: "no-store" });
              if (res.ok) {
                const data = await res.json();
                processFriendsSnapshot(data || {});
              }
            } catch (e) {}
          }
        };
        bgWorker.postMessage("START");
      } catch (e) {}
    }

    document.addEventListener("visibilitychange", () => {
      startBackgroundKeepAlive();
      if (document.hidden && currentUser?.uid) {
        syncUserToSW(prevUnreadMap);
        if (navigator.serviceWorker?.controller) {
          navigator.serviceWorker.controller.postMessage({
            type: "START_BG_WATCH",
            uid: currentUser.uid,
            lang: currentLang,
            notifEnabled: isNotifGranted(),
            unreadMap: prevUnreadMap
          });
        }
      }
    });

    window.addEventListener("pagehide", () => {
      if (currentUser?.uid && navigator.serviceWorker?.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: "START_BG_WATCH",
          uid: currentUser.uid,
          lang: currentLang,
          notifEnabled: isNotifGranted(),
          unreadMap: prevUnreadMap
        });
      }
    });

    function watchFriends() {
      if (!currentUser || friendUnsubscribe) return;
      if ("Notification" in window && Notification.permission === "default" && notifEnabled) {
        Notification.requestPermission().then(() => {
          updateSettingsLabels();
          syncUserToSW();
        }).catch(() => {});
      }
      startBackgroundWorker();
      friendUnsubscribe = onValue(ref(db, `friends/${currentUser.uid}`), snap => {
        processFriendsSnapshot(snap.val() || {});
      });
    }

    async function addFriend() {
      if (!profile) return;
      const code = safeText($("friendCodeInput").value).toUpperCase();
      if (!code) return showToast(currentLang === 'ko' ? "코드를 입력하세요" : (currentLang === 'id' ? "KETIK KODE" : "TYPE A FRIEND CODE"));
      if (code === profile.code) return showToast(currentLang === 'ko' ? "본인 코드입니다" : (currentLang === 'id' ? "INI KODEMU SENDIRI" : "THAT IS YOUR CODE"));

      $("addFriendBtn").disabled = true;
      try {
        const codeSnap = await get(ref(db, `publicCodes/${code}`));
        if (!codeSnap.exists()) return showToast("NOT FOUND");

        const target = codeSnap.val();
        const targetUid = target.uid;
        if (!targetUid || targetUid === profile.uid) return showToast("INVALID CODE");

        const userSnap = await get(ref(db, `users/${targetUid}`));
        if (!userSnap.exists()) return showToast("USER MISSING");

        const friendProfile = userSnap.val();

        await update(ref(db), {
          [`friends/${profile.uid}/${targetUid}`]: {
            uid: targetUid, nickname: friendProfile.nickname || target.nickname,
            avatar: friendProfile.avatar || target.avatar, code: friendProfile.code || code,
            addedAt: serverTimestamp(), unread: 0
          },
          [`friends/${targetUid}/${profile.uid}`]: {
            uid: profile.uid, nickname: profile.nickname,
            avatar: profile.avatar, code: profile.code,
            addedAt: serverTimestamp()
          }
        });

        $("friendCodeInput").value = "";
        showToast(currentLang === 'ko' ? "친구 추가됨!" : (currentLang === 'id' ? "TEMAN DITAMBAHKAN!" : "FRIEND ADDED!"));
        openPrivateChat(friendProfile);
      } catch (error) {
        showToast("Add error: " + error.message);
      } finally {
        $("addFriendBtn").disabled = false;
      }
    }

    async function openPrivateChat(friend) {
      if (!profile || !friend.uid) return;
      const chatId = chatIdFor(profile.uid, friend.uid);
      
      await update(ref(db, `friends/${profile.uid}/${friend.uid}`), { unread: 0 });

      currentChat = {
        type: "private",
        title: friend.nickname || "Friend",
        avatar: friend.avatar || "💬",
        path: `conversations/${chatId}/messages`,
        targetUid: friend.uid,
        chatId
      };
      
      chatOpenedAt = Date.now();

      if (messageUnsubscribe) {
        messageUnsubscribe();
        messageUnsubscribe = null;
      }

      $("chatHeaderAvatar").textContent = currentChat.avatar;
      $("chatTitle").textContent = currentChat.title;
      $("messages").innerHTML = "";
      showView("chatView");

      const recentMessages = query(ref(db, currentChat.path), limitToLast(80));
      messageUnsubscribe = onChildAdded(recentMessages, snap => {
        renderMessage(snap.val());
      });

      setTimeout(() => {
        $("messageInput").focus();
      }, 150);
    }

    async function sendMessage() {
      if (!currentChat || !profile) return;
      const input = $("messageInput");
      const text = input.value.trim();
      if (!text) return;
      
      input.value = "";

      try {
        const message = {
          from: profile.uid,
          nickname: profile.nickname,
          avatar: profile.avatar,
          text,
          createdAt: serverTimestamp()
        };

        await update(ref(db), {
          [`${currentChat.path}/${push(ref(db)).key}`]: message,
          [`friends/${currentChat.targetUid}/${profile.uid}/unread`]: increment(1),
          [`friends/${currentChat.targetUid}/${profile.uid}/lastMessageText`]: text.slice(0, 120),
          [`friends/${currentChat.targetUid}/${profile.uid}/lastMessageAt`]: serverTimestamp()
        });
      } catch (error) {
        showToast("Send error: " + error.message);
        input.value = text;
      }
    }

    function renderMessage(msg) {
      if (!msg) return;
      const isMine = msg.from === profile?.uid;
      const line = document.createElement("div");
      line.className = "smsLine" + (isMine ? " mine" : "");

      const time = typeof msg.createdAt === "number"
        ? new Date(msg.createdAt).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })
        : "sending";

      line.innerHTML = `
        <div class="smsMeta">${escapeHTML(msg.avatar || "💬")} ${escapeHTML(msg.nickname || "Guest")} · ${time}</div>
        <div class="smsText"></div>
      `;
      line.querySelector(".smsText").textContent = msg.text || "";
      $("messages").appendChild(line);

      if (!renderMessage.scrollTimer) {
        renderMessage.scrollTimer = setTimeout(() => {
          const msgBox = $("messages");
          msgBox.scrollTop = msgBox.scrollHeight;
          renderMessage.scrollTimer = null;
        }, 10);
      }

      if (!isMine && !msg._played && (typeof msg.createdAt !== 'number' || msg.createdAt > chatOpenedAt)) {
        soundIncoming();
        msg._played = true; 
      }
    }

    function renderProfile() {
      if (!profile) return;
      if (!profile.code) ensureUserCode(profile, currentUser?.uid);
      $("profileAvatar").textContent = profile.avatar || "💛";
      $("profileName").textContent = profile.nickname || "...";
      $("profileCode").textContent = profile.code || "...";
      $("myCodeBox").textContent = profile.code || "...";
      
      $("editNameInput").value = profile.nickname || "";
      editProfileAvatar = profile.avatar || avatars[0];
      renderEditAvatars();
    }

    async function saveIdentity() {
      if (!profile || !currentUser) return;
      const newName = safeText($("editNameInput").value, profile.nickname).slice(0, 24);
      
      if (newName.length < 3) {
        return showToast("NAME TOO SHORT!");
      }

      $("saveIdentityBtn").disabled = true;
      
      try {
        profile.nickname = newName;
        profile.avatar = editProfileAvatar;
        localStorage.setItem("nokiProfile", JSON.stringify(profile));
        
        const updates = {
          [`users/${currentUser.uid}/nickname`]: newName,
          [`users/${currentUser.uid}/avatar`]: editProfileAvatar
        };

        if (profile.code) {
          updates[`publicCodes/${profile.code}/nickname`] = newName;
          updates[`publicCodes/${profile.code}/avatar`] = editProfileAvatar;
        }

        const friendsList = Object.values(friends || {});
        for (const f of friendsList) {
           if (f && f.uid) {
             updates[`friends/${f.uid}/${currentUser.uid}/nickname`] = newName;
             updates[`friends/${f.uid}/${currentUser.uid}/avatar`] = editProfileAvatar;
           }
        }

        await update(ref(db), updates);
        
        renderProfile();
        $("saveIdentityBtn").innerText = t("saveIdentityBtn");
        showToast(currentLang === 'ko' ? "저장 완료" : (currentLang === 'id' ? "IDENTITAS DISIMPAN" : "IDENTITY SAVED"));
      } catch (e) {
        showToast("ERROR: " + e.message);
        $("saveIdentityBtn").innerText = t("saveIdentityBtn");
      } finally {
        $("saveIdentityBtn").disabled = false;
      }
    }

    async function copyCode() {
      if (!profile?.code) return;
      try {
        await navigator.clipboard.writeText(profile.code);
        showToast(currentLang === 'ko' ? "복사됨!" : (currentLang === 'id' ? "DISALIN!" : "CODE COPIED"));
      } catch {
        prompt("Copy your code:", profile.code);
      }
    }

    // --- BIND EVENTS ---
    document.addEventListener("click", (e) => { const ob = e.target.closest("[data-open]"); if (ob) showView(ob.dataset.open); });

    $("copyCodeBtn").addEventListener("click", copyCode);
    $("saveIdentityBtn").addEventListener("click", saveIdentity);
    $("addFriendBtn").addEventListener("click", addFriend);
    $("goHomeBtn").addEventListener("click", () => showView("homeView"));
    $("hardwareHomeBtn").addEventListener("click", () => {
      if (profile) {
        showView("homeView");
      } else {
        showView("setupView");
      }
    });
    $("chatBackBtn").addEventListener("click", () => {
       if (currentChat && profile) update(ref(db, `friends/${profile.uid}/${currentChat.targetUid}`), { unread: 0 });
       showView("inboxView"); 
    });
    $("messageForm").addEventListener("submit", (e) => { e.preventDefault(); sendMessage(); });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && profile) showView("homeView");
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "enter" && activeView === "chatView") sendMessage();
    });

    renderSetupChoices();
    renderThemeSelections();
    applyTheme(selectedTheme);
    applyLang();


  </script>
</body>
</html>
